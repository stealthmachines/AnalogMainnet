<!DOCTYPE html>
<html>
<head>
    <title>HDGL Program Interface</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.43.0/min/vs/editor/editor.main.min.css" rel="stylesheet">
    <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
    <style>
        body { margin: 0; display: flex; flex-direction: column; height: 100vh; }
        #editor { flex-grow: 1; border: none; }
        .controls {
            padding: 10px;
            background: #1e1e1e;
            display: flex;
            gap: 10px;
        }
        button {
            background: #0e639c;
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 4px;
            cursor: pointer;
        }
        button:hover { background: #1177bb; }
    </style>
</head>
<body>
    <div class="controls">
        <button onclick="sendToTape()">Send to Tape</button>
        <button onclick="clearTape()">Clear Tape</button>
    </div>
    <div id="editor"></div>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.43.0/min/vs/loader.min.js"></script>
    <script>
        require.config({ paths: { 'vs': 'https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.43.0/min/vs' }});
        require(['vs/editor/editor.main'], function() {
            window.editor = monaco.editor.create(document.getElementById('editor'), {
                value: '// Write your tape program here\n',
                language: 'python',
                theme: 'vs-dark',
                automaticLayout: true
            });
        });

        const socket = io('/program');

        function sendToTape() {
            const code = window.editor.getValue();
            console.log('Sending to tape:', code.length, 'characters');
            socket.emit('write_tape', { code });
        }

        function clearTape() {
            socket.emit('clear_tape');
            window.editor.setValue('// Write your tape program here\n');
        }

        socket.on('connect', function() {
            console.log('Program interface connected to /program namespace');
        });

        socket.on('tape_status', function(data) {
            console.log('Tape status:', data);
        });
    </script>
</body>
</html>

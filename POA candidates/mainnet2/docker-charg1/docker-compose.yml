version: "2"
services:
  rpc-node:
    build: geth-client
    restart: on-failure
    container_name: rpc-node
    hostname: rpc-node
    entrypoint: bash /root/start.sh
    command: "--datadir=/root/.chargnet --config /root/config.toml --port=22177 --networkid=22177 --http --http.api=personal,db,eth,net,web3,txpool,tx,admin --http.corsdomain=* --http.vhosts=*,host.docker.internal --http.addr=0.0.0.0 --authrpc.vhosts=* --ws --ws.addr 0.0.0.0 --cache=512 --verbosity 5"
    volumes:
      - ./files/rpc-node:/root/.chargnet:rw
      - /etc/localtime:/etc/localtime:ro
    ports:
      - "22177:22177"
      - "22177:22177/udp"
      - "8545:8545"
      - "8546:8546"
  miner1:
    build: geth-client
    restart: on-failure
    container_name: miner1
    hostname: miner1
    depends_on:
      - rpc-node
    entrypoint: bash /root/start.sh
    command: "--datadir=/root/.chargnet --config /root/config.toml --port=22171 --networkid=22177 --unlock 0x0c177edecb07acf3f4611f27e0449d75b3842c3a --password /root/pass.txt --mine --miner.etherbase 0x0c177edecb07acf3f4611f27e0449d75b3842c3a --http --http.api=personal,eth,net,web3,txpool,admin --http.vhosts=*,host.docker.internal --http.addr=0.0.0.0 --cache=512 --allow-insecure-unlock --verbosity 5"
    volumes:
      - ./files/node1:/root/.chargnet:rw
      - /etc/localtime:/etc/localtime:ro
    ports:
      - "22171:22171"
      - "22171:22171/udp"
      - "8547:8545"
  miner2:
    build: geth-client
    restart: on-failure
    container_name: miner2
    hostname: miner2
    depends_on:
      - rpc-node
    entrypoint: bash /root/start.sh
    command: "--datadir=/root/.chargnet --config /root/config.toml --port=22172 --networkid=22177 --unlock 0x33110d0269afc50f2152211a86592bda5b7b779f --password /root/pass.txt --mine --miner.etherbase 0x33110d0269afc50f2152211a86592bda5b7b779f --http --http.api=personal,eth,net,web3,txpool,admin --http.vhosts=*,host.docker.internal --http.addr=0.0.0.0 --cache=512 --allow-insecure-unlock --verbosity 5"
    volumes:
      - ./files/node2:/root/.chargnet:rw
      - /etc/localtime:/etc/localtime:ro
    ports:
      - "22172:22172"
      - "22172:22172/udp"
      - "8548:8545"




version: '3.8'

services:
  hdgl-bridge:
    build: .
    volumes:
      - ./data:/app/data
    environment:
      - ETH_PRIVATE_KEY=${ETH_PRIVATE_KEY}
      - PEER_MODE=true  # Enable peer mode
    depends_on:
      - ipfs
      - eth-node
    restart: unless-stopped

  ipfs:
    image: ipfs/go-ipfs:latest
    ports:
      - "5002:5001"  # Different port for peer
      - "8081:8080"  # Different gateway port
      - "4003:4001"  # Swarm port
    volumes:
      - ipfs-peer-data:/data/ipfs
    environment:
      - IPFS_PROFILE=server
    command:
      - "daemon"
      - "--enable-pubsub-experiment"

  eth-node:
    image: ethereum/client-go:latest
    command: >
      --http
      --http.addr 0.0.0.0
      --http.api eth,net,web3
      --http.port 8546
      --port 30304
      --bootnodes enode://4e42b51d1aadf39e39efcb4898ea43647eee6280f06109f28065558664dc6e1586b2518f61716a91e6eddf3245f8182329738e6f4bd7483e910d9cbf1ee627cc@127.0.0.1:30303
    ports:
      - "8546:8546"  # Different RPC port
      - "30304:30304"  # Different P2P port
    volumes:
      - eth-peer-data:/root/.ethereum

volumes:
  ipfs-peer-data:
  eth-peer-data:

networks:
  default:
    name: hdgl_network
    external: true